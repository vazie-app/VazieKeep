name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach a real vault, key file, password or screenshot showing entries.**
        Security vulnerabilities go through SECURITY.md, not public issues.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, iOS, macOS, Windows, Linux, Browser extension, Core]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and OS version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behaviour
    validations:
      required: true
  - type: input
    id: kdbx
    attributes:
      label: Vault format (if relevant)
      description: e.g. KDBX 4.0, Argon2id, created by KeePassXC 2.7
