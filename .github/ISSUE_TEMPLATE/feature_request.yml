name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: checkboxes
    id: principles
    attributes:
      label: Principles
      options:
        - label: Works without an account and without a network connection
        - label: Keeps the vault a standard KDBX file
