name: browser-extension

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/browser-extension/**', 'core/**', 'scripts/build-core.sh', '.github/workflows/browser-extension.yml']
  pull_request:
    paths: ['apps/browser-extension/**', 'core/**', 'scripts/build-core.sh', '.github/workflows/browser-extension.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/browser-extension
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        working-directory: core
        run: rustup toolchain install && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: ../../scripts/build-core.sh wasm
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/browser-extension/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/browser-extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run format:check
      # A production build needs the backend addresses. Pull requests have no secrets, so they get placeholders: the
      # zip this job keeps is for checking the build, never for a store.
      - run: pnpm run build
        env:
          VAZIE_ACCOUNT_ORIGIN: ${{ secrets.VAZIE_ACCOUNT_ORIGIN || 'https://account.example.invalid' }}
          VAZIE_KEEP_ORIGIN: ${{ secrets.VAZIE_KEEP_ORIGIN || 'https://keep.example.invalid' }}
          VAZIE_SITE_ORIGIN: ${{ secrets.VAZIE_SITE_ORIGIN || 'https://site.example.invalid' }}
      - run: pnpm run package
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension-chromium
          path: apps/browser-extension/dist/*.zip
          retention-days: 7
