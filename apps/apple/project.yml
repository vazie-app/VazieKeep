name: VazieKeep
options:
  bundleIdPrefix: app.vazie
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"

settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Vazie Keep
    PRODUCT_NAME: VazieKeep
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  KeepAppleKit:
    path: KeepAppleKit

targets:
  VazieKeep-iOS:
    type: application
    platform: iOS
    sources: [iOS]
    dependencies:
      - package: KeepAppleKit
        products: [KeepCore, KeepPlatform, KeepUI]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vazie.keep
        CODE_SIGN_ENTITLEMENTS: iOS/VazieKeep.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    scheme: {}

  VazieKeep-macOS:
    type: application
    platform: macOS
    sources: [macOS]
    dependencies:
      - package: KeepAppleKit
        products: [KeepCore, KeepPlatform, KeepUI]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vazie.keep.macos
        CODE_SIGN_ENTITLEMENTS: macOS/VazieKeep.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    scheme: {}
