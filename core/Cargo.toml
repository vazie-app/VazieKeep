[workspace]
resolver = "3"
members = ["keep-core", "keep-core-ffi", "keep-core-wasm"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "PolyForm-Shield-1.0.0"
publish = false

[workspace.dependencies]
keep-core = { path = "keep-core" }
aes = { version = "0.9.3", features = ["zeroize"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
cbc = { version = "0.2.1", features = ["block-padding", "zeroize"] }
chacha20 = { version = "0.10.2", features = ["zeroize"] }
ed25519-dalek = { version = "3.0.0", default-features = false }
getrandom = "0.4.3"
p256 = { version = "0.14.0", default-features = false, features = ["alloc", "ecdsa", "pem"] }
psl = "2.1.238"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
hmac = { version = "0.13.0", features = ["zeroize"] }
roxmltree = { version = "0.21.1", default-features = false, features = ["std"] }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
zeroize = { version = "1.9.0", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi = "0.32.2"
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"

[workspace.lints.rust]
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"

[profile.release.package.keep-core-wasm]
opt-level = "s"
