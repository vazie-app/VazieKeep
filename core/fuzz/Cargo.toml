version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
keep-core = { path = "../keep-core", features = ["fuzzing"] }

[workspace]

