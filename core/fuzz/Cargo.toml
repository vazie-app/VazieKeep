path = "fuzz_targets/inner_payload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "open_vault"
path = "fuzz_targets/open_vault.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_inputs"
path = "fuzz_targets/session_inputs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "key_file"
path = "fuzz_targets/key_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xml_round_trip"
path = "fuzz_targets/xml_round_trip.rs"
test = false
doc = false
